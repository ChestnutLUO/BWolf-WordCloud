<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<title>血狼破军直播词云 | BWolf</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
.header-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
}
.header-row .logo {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
}
h1 {
  font-size: 24px;
  font-weight: 700;
  color: #e94560;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 14px;
  color: #8892b0;
}
.session-list { list-style: none; }
.session-card {
  display: block;
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 12px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, transform 0.1s;
}
.session-card:hover {
  border-color: #e94560;
  transform: translateX(4px);
}
.session-card .title {
  font-size: 16px;
  font-weight: 600;
  color: #e0e0e0;
  margin-bottom: 6px;
}
.session-card .info {
  font-size: 13px;
  color: #8892b0;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.area-tag {
  display: inline-block;
  background: #0f3460;
  color: #48c9b0;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
}
.session-card .no-wc {
  font-size: 12px;
  color: #666;
  font-style: italic;
}
.empty {
  text-align: center;
  color: #8892b0;
  padding: 60px 0;
  font-size: 16px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <img src="assets/logo.svg" class="logo" alt="BWolf">
    <div>
      <h1>血狼破军直播词云</h1>
      <p class="subtitle">每场直播结束后自动生成的弹幕词云</p>
    </div>
  </div>
  <ul class="session-list" id="sessions"></ul>
  <div class="empty" id="empty" style="display:none">暂无词云数据</div>
</div>
<script>
fetch('manifest.json')
  .then(function(r) { return r.json(); })
  .then(function(sessions) {
    var list = document.getElementById('sessions');
    var empty = document.getElementById('empty');
    if (!sessions.length) { empty.style.display = ''; return; }
    sessions.forEach(function(s) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'session-card';
      if (s.wordcloud) {
        a.href = 'sessions/' + s.session_id + '/wordcloud.html';
      } else {
        a.style.opacity = '0.5';
        a.style.cursor = 'default';
      }
      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = s.title || ('直播 #' + s.session_id);
      a.appendChild(title);
      var info = document.createElement('div');
      info.className = 'info';
      var sp1 = document.createElement('span');
      sp1.textContent = s.start_time;
      var sp2 = document.createElement('span');
      sp2.textContent = '时长: ' + s.duration;
      var sp3 = document.createElement('span');
      sp3.textContent = '弹幕: ' + s.total_danmaku;
      info.appendChild(sp1);
      info.appendChild(sp2);
      info.appendChild(sp3);
      if (s.area) {
        var areaTag = document.createElement('span');
        areaTag.className = 'area-tag';
        areaTag.textContent = s.area;
        info.appendChild(areaTag);
      }
      a.appendChild(info);
      if (!s.wordcloud) {
        var nwc = document.createElement('div');
        nwc.className = 'no-wc';
        nwc.textContent = '弹幕数不足，未生成词云';
        a.appendChild(nwc);
      }
      li.appendChild(a);
      list.appendChild(li);
    });
  })
  .catch(function() {
    document.getElementById('empty').style.display = '';
    document.getElementById('empty').textContent = '加载失败';
  });
</script>
</body>
</html>
