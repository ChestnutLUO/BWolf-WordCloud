<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>弹幕词云 - 聊聊新干员 | BWolf</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #2d2d2d;
  color: #e0e0e0;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  padding: 16px 24px;
  background: #252525;
  border-bottom: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.header-logo {
  width: 45px;
  height: 45px;
  margin-right: 16px;
  flex-shrink: 0;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: #e94560;
}
.header .meta {
  font-size: 13px;
  color: #8892b0;
}
.header .meta span { margin-left: 16px; }
.area-tag {
  display: inline-block;
  background: #0f3460;
  color: #48c9b0;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 12px;
  vertical-align: middle;
}
.back-link {
  color: #e94560;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
#wordcloud-canvas {
  flex: 1;
  width: 100%;
  min-height: 600px;
}
.logo-watermark {
  position: fixed;
  bottom: 16px;
  right: 16px;
  opacity: 0.3;
  width: 120px;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="header">
  <a href="https://bwolf.work">
    <img src="../../assets/logo.svg" alt="BWolf" class="header-logo">
  </a>
  <div>
    <h1>聊聊新干员 弹幕词云</h1>
    <div class="meta">
      <span>2026-10-25 18:18</span>
      <span>弹幕数: 1002</span>
      <span>词条数: 46</span>
      <span class="area-tag">手游-明日方舟</span>
    </div>
  </div>
  <a class="back-link" href="../..">← 返回列表</a>
</div>
<div id="wordcloud-canvas"></div>
<div class="logo-watermark"><img src="../../assets/logo.svg" alt="BWolf" width="120"></div>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.3/src/wordcloud2.js"
        integrity="sha384-u5MoeP7iId/1yQx8f8/zcqsP99YhxCZvFoH6oeDF83VKVEr453M7FTJwkVy6b0Jo"
        crossorigin="anonymous"></script>
<script>
var wordData = [["？", 86], ["说不出话", 61], ["喂喂喂", 55], ["听得见", 44], ["886886", 27], ["听得到", 25], ["听不到", 24], ["先说结论", 18], ["886", 17], ["睡觉", 17], ["刚来什么杯", 16], ["小兔喝奶", 15], ["爆了", 13], ["听不见", 12], ["啥杯", 8], ["不播就丨", 8], ["?", 8], ["来点爆的", 8], ["甲哥爆了", 6], ["都听得到", 5], ["都能听到", 5], ["哈哈大笑", 5], ["扫", 5], ["刚来啥杯", 5], ["1", 5], ["何意啊", 5], ["🐉", 4], ["俯拾皆是", 4], ["懂你意思", 4], ["-3000", 4], ["sc爆了", 4], ["啥杯主播", 4], ["登山", 3], ["吹哨", 3], ["登山了", 3], ["龙了", 3], ["支支吾吾", 3], ["饿", 3], ["什么杯", 3], ["晚安", 3], ["？？", 3], ["对", 3], ["雪狼原话，塔露拉需要和聆音竞争肉鸽抓位", 3], ["现在没了", 3], ["尔多隆", 3], ["聋了", 3]];
var el = document.getElementById('wordcloud-canvas');
function render() {
  var w = el.offsetWidth;
  var h = Math.max(window.innerHeight - el.offsetTop, 600);
  el.style.height = h + 'px';
  var maxFreq = wordData[0] ? wordData[0][1] : 1;
  var maxFontSize = Math.min(w, h) * 3 / 8;
  WordCloud(el, {
    list: wordData,
    weightFactor: function(size) {
      return Math.max(Math.pow(size / maxFreq, 0.6) * maxFontSize, 10);
    },
    fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
    color: function() {
      var colors = ['#e94560','#48c9b0','#f39c12','#e74c3c','#3498db',
        '#2ecc71','#9b59b6','#1abc9c','#e67e22','#ff6b6b','#feca57',
        '#54a0ff','#5f27cd','#01a3a4','#f368e0','#ff9ff3'];
      return colors[Math.floor(Math.random() * colors.length)];
    },
    backgroundColor: '#2d2d2d',
    gridSize: 4,
    minSize: 2,
    rotateRatio: 0.4,
    minRotation: -Math.PI / 4,
    maxRotation: Math.PI / 4,
    shape: 'circle',
    ellipticity: 0.65,
    shuffle: true,
    drawOutOfBound: false,
    shrinkToFit: true
  });
}
render();
window.addEventListener('resize', function() {
  clearTimeout(window._wcTimer);
  window._wcTimer = setTimeout(render, 300);
});
</script>
</body>
</html>
