<body>
<div class="header">

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.3/src/wordcloud2.js"
        integrity="sha384-u5MoeP7iId/1yQx8f8/zcqsP99YhxCZvFoH6oeDF83VKVEr453M7FTJwkVy6b0Jo"
        crossorigin="anonymous"></script>
<script>
var wordData = [["睡觉", 345], ["886886", 102], ["？", 97], ["完结撒花", 56], ["886", 46], ["吹哨", 43], ["喂喂喂", 41], ["说不出话", 35], ["给", 20], ["好女人", 13], ["小兔喝奶", 13], ["区", 12], ["复活了", 11], ["往里进往里进", 7], ["晚安晚安", 7], ["我吃饱了", 7], ["军哥开播了？真的假的？我靠真开播了！", 7], ["忠诚", 7], ["宝贝", 6], ["活了", 6], ["军哥睡着了", 6], ["你是？", 6], ["坏女人", 5], ["晚安", 5], ["好女孩", 5], ["经典", 5], ["お休み", 5], ["这下听懂了", 5], ["复活了？", 4], ["复！活！", 4], ["学", 4], ["那明天怎么办", 4], ["何意啊", 4], ["仅此一次哦", 4], ["饿", 4], ["不赖", 4], ["军哥假死", 4], ["开一局", 3], ["她不一样", 3], ["哦？", 3], ["复活！", 3], ["怎么复活了", 3], ["？？？", 3], ["无敌了", 3], ["晚安宝贝", 3], ["跳过人生", 3], ["1500军奴", 3], ["她心里有我", 3], ["skip", 3], ["军哥睡着了吗", 3], ["该优化了", 3], ["夺回799", 3], ["苦尽甘来", 3], ["中午怎么办", 3], ["难道说", 3], ["饿啊", 3], ["?", 3], ["穿个裤子", 3]];
var el = document.getElementById('wordcloud-canvas');
function render() {
  var w = el.offsetWidth;
  var h = Math.max(window.innerHeight - el.offsetTop, 600);
  el.style.height = h + 'px';
  var maxFreq = wordData[0] ? wordData[0][1] : 1;
  var maxFontSize = Math.min(w, h) * 3 / 8;
  WordCloud(el, {
    list: wordData,
    weightFactor: function(size) {
      return Math.max(Math.pow(size / maxFreq, 0.6) * maxFontSize, 10);
    },
    fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
    color: function() {
      var colors = ['#e94560','#48c9b0','#f39c12','#e74c3c','#3498db',
        '#2ecc71','#9b59b6','#1abc9c','#e67e22','#ff6b6b','#feca57',
        '#54a0ff','#5f27cd','#01a3a4','#f368e0','#ff9ff3'];
      return colors[Math.floor(Math.random() * colors.length)];
    },
    backgroundColor: '#2d2d2d',
    gridSize: 4,
    minSize: 2,
    rotateRatio: 0.4,
    minRotation: -Math.PI / 4,
    maxRotation: Math.PI / 4,
    shape: 'circle',
    ellipticity: 0.65,
    shuffle: true,
    drawOutOfBound: false,
    shrinkToFit: true
  });
}
render();
window.addEventListener('resize', function() {
  clearTimeout(window._wcTimer);
  window._wcTimer = setTimeout(render, 300);
});
</script>
